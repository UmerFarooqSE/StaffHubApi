name: CI Dev Branch

on:
  push:
    branches: [dev]

jobs:
  build-dotnet-8:
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: '8.0'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  build-dotnet-9:
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: '9.0'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  push-and-deploy-dev:
    runs-on: ubuntu-latest
    needs: [build-dotnet-8, build-dotnet-9]
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:dev-${{ github.sha }} .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:dev-${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Install containerapp extension
        run: az extension add --name containerapp --yes
      
      - name: Deploy to dev Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:dev-${{ github.sha }}