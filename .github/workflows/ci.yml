name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: '9.0'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:${{ github.sha }} .
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:${{ github.sha }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --yes
      
      - name: Deploy to prod Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKER_HUB_USERNAME }}/staffhubapi:${{ github.sha }}